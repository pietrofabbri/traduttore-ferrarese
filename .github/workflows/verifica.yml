name: Verifica

# Il controllo continuo e' la parte del progetto che non si vede e che vale di
# piu'. Un glossario si rovina in silenzio: si aggiunge una voce con l'id
# sbagliato, si cancella una fonte, si duplica una riga. Nessuno se ne accorge
# perche' il motore continua a rispondere, solo un po' peggio.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: I test
        run: python3 prove/test_traduttore.py

      - name: I controlli sui dati
        # Escono diversamente da zero se c'e' un errore. E' voluto: il
        # workflow deve fallire quando i dati sono rotti, altrimenti e' un
        # documento che non dice niente.
        #
        # L'export sta dentro il passo e non in un passo prima: `PYTHONPATH`
        # non sopravvive al passo in cui e' stato esportato, e un controllo che
        # non trova il pacchetto fallisce per un motivo che non c'entra con i
        # dati. E' successo, e il messaggio diceva «No module named
        # traduttore» invece di quello che il controllo voleva dire.
        run: |
          export PYTHONPATH=sorgenti
          python3 -m traduttore.cli verifica

      - name: Il pacchetto si importa da dove deve
        # Un controllo che non parte non e' un controllo che passa. Questo
        # passo non confronta nulla: verifica solo che il pacchetto si
        # importi, e fallisce subito e con un messaggio chiaro invece di
        # lasciare che falliscano i controlli veri con un errore di import.
        run: |
          export PYTHONPATH=sorgenti
          python3 -c "from traduttore import cli, glossario, corpora, morfologia, motore, modello, verifica_dati, varieta, fonetica, audio; print('pacchetto importato')"

      - name: Le regole apprese sono coerenti col glossario
        # Il file delle regole e' generato. Se qualcuno lo ha modificato a mano,
        # questo controllo lo nota, perche' il file non combacia con quello che
        # `impara` produrrebbe adesso.
        run: |
          export PYTHONPATH=sorgenti
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "sorgenti")
          from traduttore import morfologia
          from traduttore.corpora import Corpus
          from traduttore.glossario import Glossario

          glossario = Glossario.da_file("dati/glossario.jsonl")
          corpus = Corpus.da_file("dati/coppie.jsonl", "dati/proverbi.jsonl")
          attese = morfologia.impara(corpus, glossario)
          try:
              conosciute = json.load(open("dati/regole.json", encoding="utf-8"))["regole"]
          except FileNotFoundError:
              conosciute = []
          if len(attese) != len(conosciute):
              print("ATTENZIONE: %d regole attese, %d nel file. Rigenera con `impara`."
                    % (len(attese), len(conosciute)))
          else:
              print("regole coerenti: %d" % len(attese))
          PY

      - name: Il sito si genera e non contiene richieste di rete
        # La pagina non deve mai chiamare fuori: e' la condizione che la rende
        # apribile da un file, senza connessione e senza server.
        #
        # La distinzione e' fra **risorse** e **rimandi**. Una risorsa — uno
        # script, un foglio di stile, un'immagine — viene scaricata dal browser
        # senza che nessuno abbia chiesto niente, e quindi viene richiesta. Un
        # rimando — un `<a href>` su una fonte, come l'indirizzo di Wiktionary
        # accanto al significato moderno — non richiede niente: e' testo che
        # diventa un collegamento solo se qualcuno lo clicca, e lo clicca per
        # andare a controllare la fonte, che e' esattamente quello che il progetto
        # vuole. Vietare anche i rimandi avrebbe tolto l'unica cosa che rende
        # una fonte citata verificabile.
        #
        # Quindi il controllo vieta `src=` verso l'esterno e vieta qualsiasi
        # chiamata a rete fatta dal codice, e i rimandi restano.
        run: |
          export PYTHONPATH=sorgenti
          python3 -m traduttore.cli web
          # Tutte le pagine, non una: il sito e' ramificato e la regola che
          # vale per la home vale per le fette del glossario.
          if grep -rnE 'src="https?://' web/*.html; then
            echo "ERRORE: una pagina carica una risorsa esterna"
            exit 1
          fi
          if grep -rnE '\b(fetch|XMLHttpRequest|WebSocket|EventSource)\s*\(' web/*.html; then
            echo "ERRORE: una pagina chiama la rete dal codice"
            exit 1
          fi
          echo "nessuna risorsa esterna, nessuna chiamata a rete"

      - name: Ogni pagina contiene i suoi dati
        # Il sito non e' piu' una pagina sola. Il controllo e' passato da «la
        # pagina contiene il glossario» a «ogni pagina contiene quello che
        # dichiara di contenere», che e' la forma giusta per un sito ramificato:
        # la domanda non e' piu' «il glossario c'e'?» ma «questa pagina ha
        # quello che le serve?».
        #
        # Il peso entra nel controllo perche' e' il numero che riguarda chi
        # apre la pagina. Il tetto e' di 3 MB: sopra, la pagina non si apre
        # subito e il progetto smette di essere consultabile, che era il
        # motivo per cui il sito e' stato diviso.
        run: |
          export PYTHONPATH=sorgenti
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, "sorgenti")
          from costruisci_web import PAGINE, NAVIGAZIONE

          def dati_di(pagina):
              m = re.search(r'<script id="dati"[^>]*>(.*?)</script>',
                            pagina, re.S)
              if not m:
                  raise SystemExit("una pagina non ha il blocco dati")
              return json.loads(m.group(1).replace("<\\/", "</"))

          # Cosa ogni pagina deve avere, e cosa non deve. Una pagina che
          # dichiara di contenere il glossario e non lo contiene e' una pagina
          # vuota con un titolo che promette.
          ATTESI = {
              "index.html": {"conteggi", "buchi", "fette"},
              "traduttore.html": {"glossario", "coppie", "proverbi", "regole",
                                  "fonetica"},
              "glossario.html": {"fette"},
              "frasi.html": {"coppie", "proverbi"},
              "suoni.html": {"glossario", "fonetica", "sintesi", "varieta"},
          }
          for pagina in PAGINE:
              percorso = os.path.join("web", pagina["file"])
              if not os.path.exists(percorso):
                  print("ERRORE: %s non e' stata generata" % pagina["file"])
                  sys.exit(1)
              testo = open(percorso, encoding="utf-8").read()
              dati = dati_di(testo)
              mancanti = ATTESI.get(pagina["file"], set()) - set(dati)
              if mancanti:
                  print("ERRORE: %s non contiene %s"
                        % (pagina["file"], ", ".join(sorted(mancanti))))
                  sys.exit(1)
              peso = len(testo)
              if peso > 3 * 1024 * 1024:
                  print("ERRORE: %s pesa %d byte: sopra il tetto di 3 MB una "
                        "pagina smette di aprirsi" % (pagina["file"], peso))
                  sys.exit(1)
              print("%-20s %7d byte" % (pagina["file"], peso))

          # La pagina delle regole non ha dati da controllare, perche' le
          # regole sono scritte nel corpo della pagina. Ha quindi un
          # controllo suo: deve portare le regole, e non deve mostrare il
          # marcatore che il generatore sostituisce. Una pagina vuota con
          # un titolo che promette regole e' il difetto che nessuno dei
          # controlli sui dati avrebbe preso.
          regole = open(os.path.join("web", "regole.html"),
                        encoding="utf-8").read()
          quante = regole.count('class="scheda regola"')
          if quante < 20:
              print("ERRORE: regole.html contiene %d regole, attese almeno 20"
                    % quante)
              sys.exit(1)
          if "<!--REGOLE-->" in regole:
              print("ERRORE: regole.html mostra il marcatore non sostituito")
              sys.exit(1)
          print("regole.html              %d regole" % quante)

          # Le fette del glossario: ogni pagina deve portare il suo pezzo e la
          # barra che porta alle altre. Una fetta senza voce e' una pagina
          # che non contiene niente, e non si vede.
          fette = [n for n in os.listdir("web")
                   if n.startswith("glossario-") and n.endswith(".html")]
          for nome in sorted(fette):
              dati = dati_di(open(os.path.join("web", nome),
                                  encoding="utf-8").read())
              if not dati.get("glossario", {}).get("voci"):
                  print("ERRORE: %s non contiene voci" % nome)
                  sys.exit(1)
              if not dati.get("fette"):
                  print("ERRORE: %s non ha la barra delle fette" % nome)
                  sys.exit(1)
          print("%d fette, ognuna con le sue voci e la sua barra" % len(fette))

          # Ogni collegamento della barra porta a una pagina che esiste. Su
          # `file://` un collegamento a un file assente non da nessun errore:
          # da una pagina che non si apre e basta.
          for file, _ in NAVIGAZIONE:
              if not os.path.exists(os.path.join("web", file)):
                  print("ERRORE: la barra porta a %s, che non esiste" % file)
                  sys.exit(1)
          print("ogni collegamento della barra porta a una pagina che esiste")
          PY

      - name: La pagina e il motore dicono la stessa cosa
        # Il motore esiste due volte: in Python e in JavaScript dentro la
        # pagina. `AGENTS.md` lo dichiara un rischio e fin qui non era
        # controllato da niente: era una regola scritta, non un controllo.
        # Questo passo confronta le risposte, frase per frase, sulle stesse
        # dodici frasi in entrambe le direzioni. Se le due copie divergono,
        # la pagina mente a chi la guarda, e il workflow fallisce.
        #
        # Gira su Node, che `ubuntu-latest` ha gia'. Su una macchina senza
        # Node il confronto si salta e lo dice: un controllo che non puo'
        # girare non deve far fallire niente, ma non deve nemmeno fingere
        # di essere passato.
        run: |
          export PYTHONPATH=sorgenti
          python3 prove/controlla_equivalenza.py

      - name: Ogni voce dichiara la sua varieta'
        # Il controllo che tiene insieme la parte geografica e quella lessicale.
        # Una voce senza varieta' e' una parola che non si sa a chi servire, e
        # il pannello continuerebbe a dire «tutto cittadino» senza accorgersene.
        # Il conteggio delle varieta' vuote resta nel log: e' il numero che
        # dice quanto copre davvero il glossario.
        run: |
          export PYTHONPATH=sorgenti
          python3 -m traduttore.cli varieta
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "sorgenti")
          from traduttore.glossario import Glossario
          from traduttore.varieta import VARIETA
          g = Glossario.da_file("dati/glossario.jsonl")
          senza = [v.id for v in g.voci if v.varieta not in VARIETA]
          if senza:
              print("ERRORE: voci con varieta' assente o inesistente: %s" % ", ".join(senza))
              sys.exit(1)
          print("ogni voce dichiara una delle cinque varieta'")
          PY

      - name: Le trascrizioni IPA sono trascrizioni
        # Il controllo meccanico della parte fonetica: nel campo IPA non ci
        # devono finire le vocali accentate italiane, che sono la grafia
        # rimessa al suo posto. Non decide se una trascrizione e' giusta -
        # quello e' affare di un parlante - ma decide se e' una trascrizione.
        run: |
          export PYTHONPATH=sorgenti
          python3 -m traduttore.cli pronuncia --tutte
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "sorgenti")
          from traduttore.fonetica import Fonetica, ipa_valida
          f = Fonetica.da_file("dati/fonetica.jsonl")
          sbagliate = [(t.id, t.ipa, ipa_valida(t.ipa)[1])
                       for t in f.trascrizioni if not ipa_valida(t.ipa)[0]]
          if sbagliate:
              for ident, ipa, caratteri in sbagliate:
                  print("ERRORE: %s ha %r in IPA: %s" % (ident, ipa, " ".join(caratteri)))
              sys.exit(1)
          print("%d trascrizioni, %d verificate da un parlante"
                % (len(f), f.quante_verificate()))
          PY

      - name: Le proposte del livello IA non sono fonti
        # La coda di revisione e' un file che qualcuno deve guardare, e una coda
        # che nessuno guarda si riempie di `da rivedere` per sempre. Il
        # conteggio nel log rende visibile il numero che conta: `approvata`.
        # E il controllo e' qui perche' l'unico modo che ha una proposta di
        # diventare una voce e' che qualcuno apra il vocabolario e scriva la
        # fonte: se la riga puo' portarsi dentro un campo `fonte`, non serve
        # nessuno.
        run: |
          export PYTHONPATH=sorgenti
          python3 -m traduttore.cli proposte

      - name: Nessuna registrazione senza consenso
        # Il controllo che non si puo' saltare. Copiare un brano in
        # `web/audio/` e' pubblicarlo: quindi nessun file audio deve trovarsi
        # nella pagina se non ha consenso, licenza e `pubblicabile`. Non si
        # controlla solo il manifesto: si controlla anche la cartella, perche'
        # un file dimenticato li' finirebbe in `web/audio/` al prossimo build.
        run: |
          export PYTHONPATH=sorgenti
          python3 -m traduttore.cli audio
          python3 - <<'PY'
          import os, shutil, sys
          sys.path.insert(0, "sorgenti")
          from traduttore.audio import Archivio
          archivio = Archivio.da_file("dati/audio.jsonl")
          pronti = {os.path.basename(b.file) for b in archivio
                    if b.publicabile() and b.esiste("audio")}
          trovati = set()
          for radice, _, file in os.walk("audio"):
              for nome in file:
                  if nome.lower().endswith((".mp3", ".ogg", ".m4a", ".oga", ".wav", ".webm")):
                      trovati.add(nome)
          estranei = trovati - pronti
          if estranei:
              print("ERRORE: file audio in audio/ che nessun brano dichiara "
                    "pubblicabile: %s" % ", ".join(sorted(estranei)))
              print("        oppure il brano ha consenso, licenza e pubblicabile: "
                    "senza le tre non si pubblica.")
              sys.exit(1)
          copia = os.path.join("web", "audio")
          if os.path.isdir(copia):
              shutil.rmtree(copia)
          print("nessuna registrazione pubblicata senza consenso: %d pronti" % len(pronti))
          PY

      - name: Nessun suono generato si fa passare per una persona
        # Il controllo che tiene separate le due cartelle di suoni.
        # `web/audio/` contiene registrazioni di persone vere e conta solo
        # quelle che hanno consenso, licenza e una decisione di pubblicazione;
        # `web/sintesi/` contiene voci fatte da `espeak-ng`. Un suono generato
        # che finisca nella prima cartella renderebbe falso un conto che il
        # progetto mostra pubblicamente, quindi qui si controlla che i due
        # insiemi non si tocchino.
        #
        # Il confronto e' per nome, non per contenuto: dentro un `wav` generato
        # non c'e' la parola «espeak» neanche una volta, quindi la domanda
        # «da quale programma viene questo file» non ha risposta sul file.
        run: |
          export PYTHONPATH=sorgenti
          python3 -m traduttore.cli sintesi
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "sorgenti")
          from traduttore.sintesi import CARTELLA, CARTELLA_BRANI, Sintesi

          radice = os.path.join("web", CARTELLA)
          sintesi = Sintesi.da_file("dati/sintesi.jsonl")
          dichiarati = {s.file for s in sintesi if s.file}
          trovati = set()
          if os.path.isdir(radice):
              trovati = {n for n in os.listdir(radice) if n.endswith(".wav")}

          # Le due meta' che mancano sono un suono che la pagina offre e non
          # suona, e un file che nessuno dichiara.
          if dichiarati - trovati:
              print("ERRORE: righe senza file: %s"
                    % ", ".join(sorted(dichiarati - trovati)))
              sys.exit(1)
          if trovati - dichiarati:
              print("ERRORE: file che nessuna riga dichiara: %s"
                    % ", ".join(sorted(trovati - dichiarati)))
              print("        rigenera con `python3 raccolta/sintetizza.py`.")
              sys.exit(1)

          # La porta chiusa. Un wav nella cartella delle persone vere che ha
          # un nome gia' dichiarato come generato e' il caso da prendere.
          brani = os.path.join("web", CARTELLA_BRANI)
          finiti = []
          if os.path.isdir(brani):
              finiti = [n for n in os.listdir(brani)
                        if n.endswith(".wav") and n in dichiarati]
          if finiti:
              print("ERRORE: suoni generati dentro %s/: %s"
                    % (CARTELLA_BRANI, ", ".join(sorted(finiti))))
              sys.exit(1)

          peso = sum(os.path.getsize(os.path.join(radice, n)) for n in trovati)
          print("%d suoni generati, %.0f KB, %d dichiarazioni di sintesi"
                % (len(trovati), peso / 1024.0, len(dichiarati)))
          print("nessuno e' un parlante ferrarese: la pagina lo dice accanto "
                "a ogni pulsante")
          PY

      - name: Ogni voce ha la sua fonte
        # Il controllo che il progetto considera non negoziabile. Una voce senza
        # fonte non blocca, ma il conto si stampa e resta nel log, cosi' non
        # si perde e non si dimentica.
        run: |
          export PYTHONPATH=sorgenti
          python3 -m traduttore.cli stato
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "sorgenti")
          from traduttore.glossario import Glossario
          g = Glossario.da_file("dati/glossario.jsonl")
          senza = [v.id for v in g.voci if not v.fonte]
          if senza:
              print("voci senza fonte: %d -> %s" % (len(senza), ", ".join(senza)))
          else:
              print("ogni voce ha la sua fonte")
          PY

      - name: I buchi dichiarati hanno un numero
        # Non e' un controllo e non fallisce: qui non c'e' niente da
        # correggere, c'e' solo da sapere. Il passo serve per un altro
        # motivo: i numeri restano nel log di ogni esecuzione, e un numero che
        # si vede solo quando qualcuno si ricorda di chiederlo non e' un
        # numero che nessuno lavora. Se una riga chiude un buco, qui il
        # numero deve scendere, e si vede che e' successo.
        run: |
          export PYTHONPATH=sorgenti
          python3 -m traduttore.cli buchi